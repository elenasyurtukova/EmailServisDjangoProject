                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'emailservisapp:client_detail' client.pk %}"

<!--                                   role="button">Редактировать</a>-->
<!--                                {% endif %}-->
<!--                                {% if perms.catalog.can_delete_product or user == product.owner %}-->
<!--                                <a class="btn btn-danger" href="{% url 'catalog:product_delete' product.pk %}"-->
<!--                                   role="button">Удалить</a>-->
<!--                                {% endif %}-->
                            </div>
                        </div>
<!--                        {% endif %}-->
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
