{% extends 'emailservisapp/base.html' %}
{% load my-tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for message in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ message.subject }}</p>
                        <p class="card-text">{{ message.body|truncatechars:30 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'emailservisapp:message_detail' message.pk %}"
                                   role="button">Перейти к сообщению</a>
                                <a class="btn btn-info" href="{% url 'emailservisapp:message_update' message.pk %}"
                                   role="button">Редактировать</a>

                                <a class="btn btn-danger" href="{% url 'emailservisapp:message_delete' message.pk %}"
                                   role="button">Удалить</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
