{% extends 'emailservisapp/base.html' %}
{% load my-tags %}
{% block content %}
<section class="py-5 text-center container">
    <div>
        <div class="col-lg-6 col-md-8 mx-auto">
            <h2 class="fw-light">Пользователи</h2>
        </div>
        <div class="album py-5 bg-body-tertiary">
            <div class="container">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    {% for user in users %}
                    <div class="col">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                {% if perms.users.can_block_user %}
                                <p class="card-text">пользователь номер: {{ user.id }}</p>
                                <p class="card-text">почта пользователя: {{ user.email }}</p>

                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                        <a class="btn btn-secondary"
                                           href="{% url 'emailservisapp:user_block' user.pk %}"
                                           role="button">Заблокировать пользователя</a>

                                    </div>
                                </div>
                                {% endif %}
                            </div>
                        </div>
                    </div>

                    {% endfor %}
                </div>
            </div>
        </div>

    </div>
</section>
{% endblock %}
